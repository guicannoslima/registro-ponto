[project]
name = "registro-ponto"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert é o padrão dos testes

[tool.ruff.lint.per-file-ignores]
"*/tests.py" = ["S105", "S106"]  # senhas fixas em testes
"*/tests/*" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "single"
exclude = ["**/models.py"]  # preservar a formatação manual dos models
