<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-titulo" aria-describedby="confirm-dialog-mensagem">
    <form method="dialog" class="confirm-dialog__conteudo">
        <h2 id="confirm-dialog-titulo"></h2>
        <p id="confirm-dialog-mensagem"></p>
        <div class="acoes confirm-dialog__acoes">
            <button type="submit" value="cancelar" class="btn btn--secundario" autofocus>Cancelar</button>
            <button id="confirm-dialog-confirmar" type="submit" value="confirmar" class="btn btn--perigo"></button>
        </div>
    </form>
</dialog>
