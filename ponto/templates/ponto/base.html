{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{% static 'ponto/estilo.css' %}">
        <title>
            {% block title %}
            Registro de Ponto
            {% endblock %}
    </title>
    </head>

    <body>
        <main>
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
            {% block conteudo %}

            {% endblock %}
        </main>
    </body>

</html>
