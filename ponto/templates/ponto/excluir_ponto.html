<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Ajuste de Ponto</title>
    </head>

    <body>
        {{ registro.get_tipo_display }}
        {{ registro.data_hora }}

        <form method="post" action="{% url 'excluir_ponto' registro.id %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Confirmar</button>
            <a href="{% url 'equipe' %}">Cancelar</a>
        </form>
    </body>
</html>
