<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Registro de Ponto</title>
</head>
<body>
    <h1>Registro de Ponto</h1>
    <h2>Entrar</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    <p>Não tem uma conta? <a href="{% url 'cadastro_usuario' %}">Cadastre-se aqui</a></p>
    <a href="{% url 'password_reset' %}">Esqueceu sua senha?</a>
</body>
</html>
